name: Regression and isolation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tramitia_test
      POSTGRES_USER: tramitia
      POSTGRES_PASSWORD: ci-only-db-password
      TRAMITIA_JWT_SECRET: ci-only-secret-not-for-production-use-123456789
      TRAMITIA_TEST_POSTGRES: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tramitia_test
          POSTGRES_USER: tramitia
          POSTGRES_PASSWORD: ci-only-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tramitia -d tramitia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend behavior
        run: |
          node --check frontend/app.js
          node --test tests/test_frontend.cjs
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run unit and PostgreSQL isolation tests
        run: python -m unittest discover -s tests -v
