name: Regression and isolation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tramitia_test
      POSTGRES_USER: tramitia
      POSTGRES_PASSWORD: ci-only-db-password
      TRAMITIA_JWT_SECRET: ci-only-secret-not-for-production-use-123456789
      TRAMITIA_TEST_POSTGRES: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tramitia_test
          POSTGRES_USER: tramitia
          POSTGRES_PASSWORD: ci-only-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tramitia -d tramitia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend behavior
        run: |
          node --check frontend/app.js
          node --test tests/test_frontend.cjs
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run unit and PostgreSQL isolation tests
        run: python -m unittest discover -s tests -v

      - name: Build read-only networkless PDF container image
        run: docker build -f Dockerfile.pdf-worker -t tramitia-pdf-worker:ci .
      - name: Verify real PDF container boundaries
        env:
          TRAMITIA_PDF_WORKER_BACKEND: container
          TRAMITIA_PDF_WORKER_IMAGE: tramitia-pdf-worker:ci
          TRAMITIA_CONTAINER_PDF_TEST: "1"
        run: python -m unittest discover -s tests -p test_pdf_container.py -v

      - name: Build pre-isolated daemonless PDF broker image
        run: docker build -f Dockerfile.pdf-broker -t tramitia-pdf-broker:ci .
      - name: Verify daemonless broker has no Docker, network or credentials
        run: |
          set -euo pipefail
          TRAMITIA_WEB_GID=65534 docker compose -f deploy/pdf-broker.compose.yml config --quiet
          bash tests/smoke_daemonless_broker.sh

      - name: Validate HTTPS NGINX ingress syntax
        run: |
          set -euo pipefail
          certdir=$(mktemp -d)
          trap 'rm -rf "$certdir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$certdir/privkey.pem" \
            -out "$certdir/fullchain.pem" \
            -subj '/CN=tramitia.example.invalid' >/dev/null 2>&1
          docker run --rm --network=none \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$certdir:/etc/nginx/tls:ro" \
            nginx:1.27-alpine nginx -t

      - name: Install headless Chromium for real browser journey
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: E2E gestoría owner → invitation → employee → PDF → export
        env:
          TRAMITIA_BROWSER_E2E: "1"
          TRAMITIA_BROWSER_BASE_URL: http://127.0.0.1:8000
          TRAMITIA_PDF_WORKER_BACKEND: broker
          TRAMITIA_PDF_WORKER_IMAGE: tramitia-pdf-worker:ci
        run: |
          set -euo pipefail
          # A dedicated OS identity owns the web API and MUST NOT belong to
          # docker/runner groups; only the trusted broker may access Docker.
          sudo groupadd --system tramitia-ci-web
          sudo useradd --system --create-home --gid tramitia-ci-web \
            --shell /usr/sbin/nologin tramitia-ci-web
          if id -nG tramitia-ci-web | grep -qw docker; then
            echo "SECURITY FAILURE: Web API identity has Docker membership" >&2
            exit 1
          fi
          test -S /var/run/docker.sock
          if sudo -u tramitia-ci-web test -r /var/run/docker.sock; then
            echo "SECURITY FAILURE: Web API can access the Docker socket" >&2
            exit 1
          fi
          # The runner checkout may not be traversable by the dedicated
          # accounts. Stage only public application code into an immutable,
          # root-owned temporary directory. Never stage .env or test secrets.
          stage_dir=$(mktemp -d)
          cp -a app frontend scripts "$stage_dir/"
          sudo chown -R root:root "$stage_dir"
          sudo chmod -R u=rwX,go=rX "$stage_dir"
          broker_dir=$(mktemp -d)
          chmod 750 "$broker_dir"
          sudo chown "$(id -un)":tramitia-ci-web "$broker_dir"
          export TRAMITIA_BROKER_SOCKET="$broker_dir/pdf.sock"
          broker_gid=$(getent group tramitia-ci-web | cut -d: -f3)
          test -r /var/run/docker.sock
          if ! test -r /var/run/docker.sock; then
            echo "SECURITY TEST SETUP FAILURE: runner broker cannot access Docker" >&2
            exit 1
          fi
          # CI's runner is the trusted broker identity; the API web user
          # remains a separate account with no access to the Docker socket.
          # The broker receives no JWT/database credentials.
          (
            cd "$stage_dir"
            env -i PATH="$PATH" HOME="$HOME" \
              PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 \
              TRAMITIA_PDF_WORKER_BACKEND=container \
              TRAMITIA_PDF_WORKER_IMAGE=tramitia-pdf-worker:ci \
              TRAMITIA_BROKER_SOCKET="$TRAMITIA_BROKER_SOCKET" \
              "$(command -v python)" -u -m app.pdf_broker > /tmp/tramitia-broker.log 2>&1
          ) &
          broker_pid=$!
          trap 'kill "$broker_pid" "${server_pid:-}" 2>/dev/null || true; sudo pkill -u tramitia-ci-web -f "uvicorn app.main:app" 2>/dev/null || true; sudo rm -f "$TRAMITIA_BROKER_SOCKET"; sudo rmdir "$broker_dir" 2>/dev/null || true; sudo rm -rf "$stage_dir"' EXIT
          # Fail promptly if the trusted broker cannot bind its local Unix socket.
          # This startup budget is separate from the 15s PDF parse timeout.
          for attempt in $(seq 1 45); do
            if [ -S "$TRAMITIA_BROKER_SOCKET" ]; then
              break
            fi
            if ! kill -0 "$broker_pid" 2>/dev/null; then
              echo "Broker process exited early" >&2
              break
            fi
            sleep 1
          done
          if ! test -S "$TRAMITIA_BROKER_SOCKET"; then
            echo "PDF broker did not start:" >&2
            cat /tmp/tramitia-broker.log
            ls -ld "$stage_dir" "$broker_dir" || true
            ps -eo user,pid,args | grep '[p]df_broker' || true
            exit 1
          fi
          # The runner cannot chgrp into the newly created group directly.
          # After binding, root assigns only the private broker socket to the
          # web account's group; the API does not receive Docker access.
          sudo chgrp tramitia-ci-web "$TRAMITIA_BROKER_SOCKET"
          sudo chmod 660 "$TRAMITIA_BROKER_SOCKET"
          test "$(stat -c %a "$TRAMITIA_BROKER_SOCKET")" = "660"
          test "$(stat -c %U "$TRAMITIA_BROKER_SOCKET")" = "$(id -un)"
          test "$(stat -c %G "$TRAMITIA_BROKER_SOCKET")" = "tramitia-ci-web"
          echo "PDF broker socket bound with correct owner, group and permissions"
          # The web account must have no direct access to the Docker control plane.
          if sudo -n setpriv --reuid="$(id -u tramitia-ci-web)" \
            --regid="$(id -g tramitia-ci-web)" --init-groups \
            test -r /var/run/docker.sock; then
            echo "SECURITY FAILURE: web account can read Docker socket" >&2
            exit 1
          fi
          # Verify real permissioned PDF processing as the unprivileged web
          # identity, while the web cannot access the Docker control plane.
          (
            cd "$stage_dir"
            sudo -n setpriv --reuid="$(id -u tramitia-ci-web)" \
              --regid="$(id -g tramitia-ci-web)" --init-groups \
              env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
              TRAMITIA_PDF_WORKER_BACKEND=broker \
              TRAMITIA_BROKER_SOCKET="$TRAMITIA_BROKER_SOCKET" \
              "$(command -v python)" -c 'from app.pdf_processing import parse_pdf_document; from scripts.generate_demo_pdf import make_demo_pdf; text, pages = parse_pdf_document(make_demo_pdf()); assert pages == 1 and "Solicitud ficticia" in text'
          )
          # Run actual FastAPI under the unprivileged account: JWT and
          # database credentials are scoped to the API, not the broker.
          (
            cd "$stage_dir"
            sudo -n setpriv --reuid="$(id -u tramitia-ci-web)" \
              --regid="$(id -g tramitia-ci-web)" --init-groups \
              env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 \
              POSTGRES_HOST="$POSTGRES_HOST" POSTGRES_PORT="$POSTGRES_PORT" \
              POSTGRES_DB="$POSTGRES_DB" POSTGRES_USER="$POSTGRES_USER" \
              POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              TRAMITIA_JWT_SECRET="$TRAMITIA_JWT_SECRET" \
              TRAMITIA_DEPLOYMENT_PROFILE=isolated \
              TRAMITIA_PDF_WORKER_BACKEND=broker \
              TRAMITIA_BROKER_SOCKET="$TRAMITIA_BROKER_SOCKET" \
              "$(command -v python)" -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-proxy-headers --log-level warning > /tmp/tramitia-e2e-uvicorn.log 2>&1
          ) &
          server_pid=$!
          for attempt in $(seq 1 180); do
            if curl --silent --max-time 2 --fail http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --silent --show-error --max-time 3 --fail http://127.0.0.1:8000/health; then
            echo "API did not become healthy under unprivileged user" >&2
            tail -n 100 /tmp/tramitia-e2e-uvicorn.log || true
            exit 1
          fi
          python -m unittest discover -s tests -p browser_journey.py -v

