# Example HTTPS-only ingress for a single trusted-host deployment.
# Replace tramitia.example.invalid, install your own TLS certificates and
# bind Uvicorn ONLY on 127.0.0.1:8000 with --no-proxy-headers.
#
# This is a defense-in-depth example and MUST be reviewed before production.
# Keep the FastAPI port unreachable from other machines/containers.
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # These are leaky-bucket edge limits, intentionally independent from the
    # persistent fixed-window PostgreSQL request counters.
    limit_req_zone $binary_remote_addr zone=tramitia_login:10m rate=4r/m;
    limit_req_zone $binary_remote_addr zone=tramitia_invite:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=tramitia_upload:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=tramitia_connections:10m;

    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name tramitia.example.invalid;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        return 444;
    }
    server {
        listen 443 ssl;
        server_name tramitia.example.invalid;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # Reject excess upload bytes BEFORE buffering them into FastAPI.
        client_max_body_size 21m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 30s;
        keepalive_timeout 15s;
        client_body_buffer_size 128k;

        limit_conn tramitia_connections 8;

        # Only NGINX itself may supply X-Real-IP. Never pass through
        # client-supplied Forwarded, X-Forwarded-For, etc.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Proxy "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;

        location = /auth/login {
            limit_req zone=tramitia_login burst=10 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }
        location = /auth/invitations/accept {
            limit_req zone=tramitia_invite burst=6 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }
        location = /analyze {
            limit_req zone=tramitia_upload burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}
